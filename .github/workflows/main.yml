name: Build Plugin

on:
  push:
    branches: [ "remapped" ]
  pull_request:
    branches: [ "remapped" ]
  workflow_dispatch: # 允许手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. 检出代码
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 获取完整的 git 历史，这对 getGitCommitHash() 函数获取准确的 hash 很有帮助

      # 2. 设置 Java 21 (对应 build.gradle.kts 中的 toolchain)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 设置 Gradle (自动处理缓存，无需手动配置缓存)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. 授予 gradlew 执行权限 (防止权限不足错误)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 执行构建
      # HMCC_INCLUDE_HASH="true" 确保触发你的 getGitCommitHash 逻辑
      - name: Build with Gradle
        run: ./gradlew build shadowJar
        env:
          HMCC_INCLUDE_HASH: "true"

      # 6. 上传构建产物 (Jar 包)
      # 你的脚本中配置了 shadowJar 任务输出到 build/libs
      - name: Upload Plugin Jar
        uses: actions/upload-artifact@v7
        with:
          name: HMCCosmetics-Jars-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 7
          if-no-files-found: error
